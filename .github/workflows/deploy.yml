name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      # basePath はリポジトリ名から自動決定する（spec.md §5.1 (c)）。
      # 手で設定させないことで、設定漏れによる事故をなくす。
      - name: Resolve base path
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "BASE_PATH=" >> $GITHUB_ENV
          else
            echo "BASE_PATH=/$REPO" >> $GITHUB_ENV
          fi
      - run: npm run build
      # 外部ドメインへの参照が混入していないことを確認する（spec.md §11.6）
      - run: npm run check:no-external
      # 事前にリポジトリ設定の Settings → Pages → Source を
      # 「GitHub Actions」にしておくこと。workflow の GITHUB_TOKEN には
      # Pages サイトを新規作成する権限がないため（enablement: true は
      # "Resource not accessible by integration" で失敗する）、
      # ここだけは手作業が要る。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
