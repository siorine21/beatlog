<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Beatlog のアイコン。8ビート基本形のグリッドそのものを図案にしている。
    上段（金）= ハイハット8分、中段（赤）= 2・4拍のスネア、下段（青）= 1・3拍のバスドラム。
    色は src/lib/lanes.ts の LANE_COLOR と同じ。
  -->
  <rect width="512" height="512" rx="112" fill="#0f1115"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#272c34" stroke-width="12"/>

  <g>
    <!-- ハイハット: 4つすべて -->
    <g fill="#d2a34a">
      <rect x="60" y="150" width="82" height="56" rx="16"/>
      <rect x="158" y="150" width="82" height="56" rx="16"/>
      <rect x="272" y="150" width="82" height="56" rx="16"/>
      <rect x="370" y="150" width="82" height="56" rx="16"/>
    </g>
    <!-- スネア: 2拍目と4拍目 -->
    <g fill="#d05b50">
      <rect x="60" y="228" width="82" height="56" rx="16" opacity="0.16"/>
      <rect x="158" y="228" width="82" height="56" rx="16"/>
      <rect x="272" y="228" width="82" height="56" rx="16" opacity="0.16"/>
      <rect x="370" y="228" width="82" height="56" rx="16"/>
    </g>
    <!-- バスドラム: 1拍目と3拍目 -->
    <g fill="#4b84c4">
      <rect x="60" y="306" width="82" height="56" rx="16"/>
      <rect x="158" y="306" width="82" height="56" rx="16" opacity="0.16"/>
      <rect x="272" y="306" width="82" height="56" rx="16"/>
      <rect x="370" y="306" width="82" height="56" rx="16" opacity="0.16"/>
    </g>
  </g>
</svg>
